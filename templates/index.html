<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="hero">
        <h1>Resume Analyzer</h1>
        <p class="subtitle">
            Upload your resume and a job description to see how well you match — and how to improve.
        </p>
    </div>

    <form class="analyze-form" action="/analyze" method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label>📄 Upload Resume (PDF)</label>
            <input type="file" name="resume" accept=".pdf" required>
        </div>

        <div class="form-group">
            <label>📝 Paste Job Description</label>
            <textarea
                name="job_description"
                rows="8"
                placeholder="Paste the job description here..."
                required></textarea>
        </div>

        <button type="submit" class="analyze-btn">
            Analyze Resume ✨
        </button>

    </form>

    <div class="footer-note">
        <p>Built to help you tailor your resume for each role.</p>
    </div>

</div>

</body>
</html>
